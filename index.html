<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HVL Lab - SystemVerilog Experiments</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">[SV]</span>
    <div>
      <h1>HVL Lab</h1>
      <p>SystemVerilog &middot; RTL + Testbench</p>
    </div>
  </div>
  <div class="topbar-right">
    <input id="search" type="text" placeholder="Search experiments..." aria-label="Search experiments" autocomplete="off">
    <span id="count" class="count" aria-live="polite"></span>
  </div>
</header>

<main class="wrap">

  <!-- Home / experiment picker -->
  <section id="homeView" aria-label="Experiment list">
    <h2 class="section-title">Select an experiment</h2>
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden style="display:none;">No experiments match your search.</p>
  </section>

  <!-- Detail / side-by-side code -->
  <section id="detailView" hidden style="display:none;" aria-label="Experiment code">
    <div class="detail-head">
      <button id="backBtn" class="btn" type="button">&larr; All experiments</button>
      <div class="detail-title">
        <h2 id="expTitle"></h2>
        <p id="expDesc"></p>
      </div>
    </div>

    <div class="detail-actions">
      <button id="copyAllBtn" class="btn primary" type="button">Copy RTL + TB</button>
      <button id="dlAllBtn" class="btn" type="button">Download both</button>
    </div>

    <div class="panes">
      <article class="pane" aria-label="RTL code">
        <div class="pane-head">
          <div>
            <strong>RTL</strong>
            <span id="rtlName" class="file"></span>
          </div>
          <div class="pane-btns">
            <button id="copyRtlBtn" class="btn small primary" type="button">Copy</button>
            <button id="dlRtlBtn" class="btn small ghost" type="button">.sv</button>
          </div>
        </div>
        <div class="code-scroll" id="rtlScroll">
          <div class="code-row">
            <div class="gutter" id="rtlGutter" aria-hidden="true"></div>
            <pre class="code"><code id="rtlCode"></code></pre>
          </div>
        </div>
      </article>

      <article class="pane" aria-label="Testbench code">
        <div class="pane-head tb">
          <div>
            <strong>Testbench</strong>
            <span id="tbName" class="file"></span>
          </div>
          <div class="pane-btns">
            <button id="copyTbBtn" class="btn small primary" type="button">Copy</button>
            <button id="dlTbBtn" class="btn small ghost" type="button">.sv</button>
          </div>
        </div>
        <div class="code-scroll" id="tbScroll">
          <div class="code-row">
            <div class="gutter" id="tbGutter" aria-hidden="true"></div>
            <pre class="code"><code id="tbCode"></code></pre>
          </div>
        </div>
      </article>
    </div>
  </section>

</main>

<footer class="footer">
  <span>Source: <code>HVL_LAB</code> &middot; each experiment = <code>rtl/top.sv</code> + <code>tb/tb_top.sv</code></span>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="experiments.js"></script>
<script src="app.js"></script>
</body>
</html>
