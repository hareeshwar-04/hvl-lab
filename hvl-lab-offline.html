<title>HVL Lab - SystemVerilog Experiments</title>
<style>
/* HVL Lab viewer — universal legacy-compatible stylesheet (works on old Firefox ESR, Chrome, IE11+, file://) */
* { margin: 0; padding: 0; -webkit-box-sizing: border-box; -moz-box-sizing: border-box; box-sizing: border-box; }

[hidden] { display: none !important; }
header, main, section, article, footer { display: block; }

html { -webkit-text-size-adjust: 100%; background: #0e131d; color: #e6ebf4; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "DejaVu Sans", "Liberation Sans", Helvetica, Arial, sans-serif;

  line-height: 1.5;
  min-height: 100vh;
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  -webkit-box-orient: vertical;
  -webkit-box-direction: normal;
  -ms-flex-direction: column;

}

/* ---------- top bar ---------- */
.topbar {
  background: #171f2e;

  display: -ms-flexbox;

}
.brand {

  display: -ms-flexbox;
  display: flex;
  -webkit-box-align: center;
  -ms-flex-align: center;
  align-items: center;
  margin-right: 16px;
}
.brand-mark {
  font-family: "DejaVu Sans Mono", "Liberation Mono", Menlo, Consolas, monospace;
  font-size: 16px;
  font-weight: 700;
  color: #5b8cff;
  background: #101724;
  border: 1px solid #2a3547;
  border-radius: 6px;
  padding: 6px 8px;
  line-height: 1;
  margin-right: 12px;
}
.brand h1 { font-size: 20px; letter-spacing: -0.01em; color: #e6ebf4; }
.brand p { font-size: 12.5px; color: #9aa7bd; }
.topbar-right {
  margin-left: auto;
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  -webkit-box-align: center;
  -ms-flex-align: center;
  align-items: center;
}
#search {
  font: inherit;
  font-size: 14px;
  padding: 8px 12px;
  border: 1px solid #2a3547;
  border-radius: 8px;
  width: 240px;
  max-width: 60vw;
  background: #101724;
  color: #e6ebf4;
  margin-right: 10px;
}
#search:focus { outline: 2px solid #5b8cff; border-color: #5b8cff; }
.count { font-size: 12.5px; color: #9aa7bd; white-space: nowrap; }

/* ---------- layout ---------- */
.wrap {
  width: 1180px;
  max-width: 100%;
  margin: 0 auto;
  padding: 24px 20px 40px;
  -webkit-box-flex: 1;
  -ms-flex: 1 0 auto;
  flex: 1 0 auto;
}
.section-title { font-size: 17px; margin-bottom: 14px; color: #e6ebf4; }

/* ---------- cards (flexbox fallback for old browsers + grid) ---------- */
.grid {
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  -ms-flex-wrap: wrap;
  flex-wrap: wrap;
  margin: -7px;
}
.card {
  font: inherit;
  text-align: left;
  background: #171f2e;
  border: 1px solid #2a3547;
  border-radius: 10px;
  padding: 16px;
  cursor: pointer;
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  -webkit-box-orient: vertical;
  -webkit-box-direction: normal;
  -ms-flex-direction: column;
  flex-direction: column;
  width: 270px;
  -webkit-box-flex: 1;
  -ms-flex: 1 1 250px;
  flex: 1 1 250px;
  margin: 7px;
  color: #e6ebf4;
  transition: border-color .12s, box-shadow .12s;
}
.card:hover, .card:focus {
  border-color: #5b8cff;
  box-shadow: 0 4px 16px rgba(29, 78, 216, .18);
  outline: none;
}
.card h3 { font-size: 15.5px; margin-bottom: 6px; color: #e6ebf4; }
.card p { font-size: 13px; color: #9aa7bd; margin-bottom: 8px; -webkit-box-flex: 1; -ms-flex: 1 0 auto; flex: 1 0 auto; }
.card .meta {
  font-size: 11.5px;
  color: #9aa7bd;
  font-family: "DejaVu Sans Mono", "Liberation Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
.empty { color: #9aa7bd; padding: 30px 0; }

/* ---------- detail ---------- */
.detail-head {
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  -webkit-box-align: start;
  -ms-flex-align: start;
  align-items: flex-start;
  margin-bottom: 12px;
  -ms-flex-wrap: wrap;
  flex-wrap: wrap;
}
.detail-head #backBtn { margin-right: 14px; margin-bottom: 6px; }
.detail-title h2 { font-size: 21px; letter-spacing: -0.01em; color: #e6ebf4; }
.detail-title p { color: #9aa7bd; font-size: 13.5px; }
.detail-actions {
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  margin-bottom: 14px;
  -ms-flex-wrap: wrap;
  flex-wrap: wrap;
}
.detail-actions .btn { margin-right: 8px; margin-bottom: 6px; }

/* ---------- buttons ---------- */
.btn {
  font: inherit;
  font-size: 13.5px;
  font-weight: 600;
  border: 1px solid #2a3547;
  background: #171f2e;
  color: #e6ebf4;
  border-radius: 8px;
  padding: 8px 14px;
  cursor: pointer;
  display: inline-block;
}
.btn:hover { border-color: #9aa7bd; background: #212b40; }
.btn.primary { background: #5b8cff; border-color: #5b8cff; color: #0b1220; }
.btn.primary:hover { background: #7ba0ff; }
.btn.ghost { background: transparent; }
.btn.small { font-size: 12.5px; padding: 5px 11px; }

/* ---------- side-by-side panes ---------- */
.panes {
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  -webkit-box-align: stretch;
  -ms-flex-align: stretch;
  align-items: stretch;
}
.pane {
  -webkit-box-flex: 1;
  -ms-flex: 1 1 0%;
  flex: 1 1 0%;
  width: 49%;
  min-width: 0;
  background: #171f2e;
  border: 1px solid #2a3547;
  border-radius: 10px;
  overflow: hidden;
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  -webkit-box-orient: vertical;
  -webkit-box-direction: normal;
  -ms-flex-direction: column;
  flex-direction: column;
}
.pane + .pane { margin-left: 14px; }
.pane-head {
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  -webkit-box-align: center;
  -ms-flex-align: center;
  align-items: center;
  -webkit-box-pack: justify;
  -ms-flex-pack: justify;
  justify-content: space-between;
  padding: 10px 12px;
  border-bottom: 1px solid #2a3547;
  border-top: 3px solid #22d3ee;
  background: #141b2a;
  -ms-flex-wrap: wrap;
  flex-wrap: wrap;
}
.pane-head.tb { border-top-color: #a78bfa; }
.pane-head strong { font-size: 13.5px; color: #e6ebf4; }
.pane-head .file {
  font-family: "DejaVu Sans Mono", "Liberation Mono", SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11.5px;
  color: #9aa7bd;
  margin-left: 8px;
}
.pane-btns {
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
}
.pane-btns .btn + .btn { margin-left: 6px; }

/* ---------- code ---------- */
.code-scroll { overflow: auto; max-height: 68vh; background: #0a0f1c; }
.code-row {
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  min-height: 100%;
}
.gutter {
  -webkit-box-flex: 0;
  -ms-flex: 0 0 auto;
  flex: 0 0 auto;
  padding: 12px 10px 12px 14px;
  text-align: right;
  color: #64748b;
  background: #070b14;
  border-right: 1px solid #1a2334;
  font-family: "DejaVu Sans Mono", "Liberation Mono", SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12.5px;
  line-height: 1.65;
  white-space: pre;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}
.code {
  -webkit-box-flex: 1;
  -ms-flex: 1 0 auto;
  flex: 1 0 auto;
  padding: 12px 16px;
  font-family: "DejaVu Sans Mono", "Liberation Mono", SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12.5px;
  line-height: 1.65;
  white-space: pre;
  color: #e2e8f0;
}
.code .c-com { color: #7d8aa0; font-style: italic; }
.code .c-str { color: #a5d6a7; }
.code .c-pp  { color: #f0abfc; }
.code .c-kw  { color: #93c5fd; }
.code .c-num { color: #fbbf24; }

/* ---------- footer + toast ---------- */
.footer {
  border-top: 1px solid #2a3547;
  padding: 12px 20px;
  font-size: 12px;
  color: #9aa7bd;
  background: #171f2e;
}
.footer code {
  font-family: "DejaVu Sans Mono", "Liberation Mono", SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11.5px;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  -webkit-transform: translateX(-50%);
  -ms-transform: translateX(-50%);
  transform: translateX(-50%);
  background: #111827;
  border: 1px solid #5b8cff;
  color: #ffffff;
  font-size: 13.5px;
  padding: 10px 18px;
  border-radius: 8px;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .15s;
  max-width: 90%;
  z-index: 50;
}
.toast.show { opacity: 1; visibility: visible; }

/* ---------- small screens: stack panes ---------- */
@media (max-width: 900px) {
  .panes {
    -webkit-box-orient: vertical;
    -webkit-box-direction: normal;
    -ms-flex-direction: column;
    flex-direction: column;
  }
  .pane { width: 100%; }
  .pane + .pane { margin-left: 0; margin-top: 14px; }
  .code-scroll { max-height: none; }
  #search { width: 100%; }
  .topbar-right { width: 100%; margin-top: 10px; }
}

</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">[SV]</span>
    <div>
      <h1>HVL Lab</h1>
      <p>SystemVerilog &middot; RTL + Testbench</p>
    </div>
  </div>
  <div class="topbar-right">
    <input id="search" type="text" placeholder="Search experiments..." aria-label="Search experiments" autocomplete="off">
    <span id="count" class="count" aria-live="polite"></span>
  </div>
</header>

<main class="wrap">

  <!-- Home / experiment picker -->
  <section id="homeView" aria-label="Experiment list">
    <h2 class="section-title">Select an experiment</h2>
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden style="display:none;">No experiments match your search.</p>
  </section>

  <!-- Detail / side-by-side code -->
  <section id="detailView" hidden style="display:none;" aria-label="Experiment code">
    <div class="detail-head">
      <button id="backBtn" class="btn" type="button">&larr; All experiments</button>
      <div class="detail-title">
        <h2 id="expTitle"></h2>
        <p id="expDesc"></p>
      </div>
    </div>

    <div class="detail-actions">
      <button id="copyAllBtn" class="btn primary" type="button">Copy RTL + TB</button>
      <button id="dlAllBtn" class="btn" type="button">Download both</button>
    </div>

    <div class="panes">
      <article class="pane" aria-label="RTL code">
        <div class="pane-head">
          <div>
            <strong>RTL</strong>
            <span id="rtlName" class="file"></span>
          </div>
          <div class="pane-btns">
            <button id="copyRtlBtn" class="btn small primary" type="button">Copy</button>
            <button id="dlRtlBtn" class="btn small ghost" type="button">.sv</button>
          </div>
        </div>
        <div class="code-scroll" id="rtlScroll">
          <div class="code-row">
            <div class="gutter" id="rtlGutter" aria-hidden="true"></div>
            <pre class="code"><code id="rtlCode"></code></pre>
          </div>
        </div>
      </article>

      <article class="pane" aria-label="Testbench code">
        <div class="pane-head tb">
          <div>
            <strong>Testbench</strong>
            <span id="tbName" class="file"></span>
          </div>
          <div class="pane-btns">
            <button id="copyTbBtn" class="btn small primary" type="button">Copy</button>
            <button id="dlTbBtn" class="btn small ghost" type="button">.sv</button>
          </div>
        </div>
        <div class="code-scroll" id="tbScroll">
          <div class="code-row">
            <div class="gutter" id="tbGutter" aria-hidden="true"></div>
            <pre class="code"><code id="tbCode"></code></pre>
          </div>
        </div>
      </article>
    </div>
  </section>

</main>

<footer class="footer">
  <span>Source: <code>HVL_LAB</code> &middot; each experiment = <code>rtl/top.sv</code> + <code>tb/tb_top.sv</code></span>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

var EXPERIMENTS = [
 {
  "id": "alu",
  "title": "ALU",
  "desc": "8-bit ALU with HVL testbench (generator, driver, monitor, scoreboard).",
  "rtlFile": "rtl/top.sv",
  "tbFile": "tb/tb_top.sv",
  "rtl": "`timescale 1ns/1ps\n\nmodule alu_8bit (\n    input  logic [7:0] a,\n    input  logic [7:0] b,\n    input  logic [2:0] opcode,\n    output logic [7:0] result\n);\n\n    always_comb begin\n        case (opcode)\n            3'b000: result = a + b;\n            3'b001: result = a - b;\n            3'b010: result = a & b;\n            3'b011: result = a | b;\n            3'b100: result = a ^ b;\n            3'b101: result = ~(a & b);\n            3'b110: result = ~(a | b);\n            3'b111: result = ~(a ^ b);\n            default: result = 8'h00;\n        endcase\n    end\n\nendmodule\n",
  "tb": "`timescale 1ns/1ps\n\ninterface alu_if;\n\n    logic [7:0] a;\n    logic [7:0] b;\n    logic [2:0] opcode;\n    logic [7:0] result;\n\nendinterface\n\nclass alu_transaction;\n\n    rand bit [7:0] a;\n    rand bit [7:0] b;\n    rand bit [2:0] opcode;\n\n    logic [7:0] result;\n\nendclass\n\nclass alu_generator;\n\n    mailbox #(alu_transaction) gen2drv;\n    int n;\n\n    function new\n    (\n        mailbox #(alu_transaction) gen2drv,\n        int n\n    );\n\n        this.gen2drv = gen2drv;\n        this.n       = n;\n\n    endfunction\n\n    task run();\n\n        alu_transaction tr;\n\n        repeat(n)\n        begin\n\n            tr = new();\n\n            if(!tr.randomize())\n                $display(\"Randomization failed\");\n\n            gen2drv.put(tr);\n\n        end\n\n    endtask\n\nendclass\n\nclass alu_driver;\n\n    virtual alu_if vif;\n\n    mailbox #(alu_transaction) gen2drv;\n    mailbox #(alu_transaction) drv2mon;\n\n    int n;\n\n    function new\n    (\n        virtual alu_if vif,\n        mailbox #(alu_transaction) gen2drv,\n        mailbox #(alu_transaction) drv2mon,\n        int n\n    );\n\n        this.vif     = vif;\n        this.gen2drv = gen2drv;\n        this.drv2mon = drv2mon;\n        this.n       = n;\n\n    endfunction\n\n    task run();\n\n        alu_transaction tr;\n\n        repeat(n)\n        begin\n\n            gen2drv.get(tr);\n\n            vif.a      = tr.a;\n            vif.b      = tr.b;\n            vif.opcode = tr.opcode;\n\n            #1;\n\n            drv2mon.put(tr);\n\n            #1;\n\n        end\n\n    endtask\n\nendclass\n\nclass alu_monitor;\n\n    virtual alu_if vif;\n\n    mailbox #(alu_transaction) drv2mon;\n    mailbox #(alu_transaction) mon2sb;\n\n    int n;\n\n    function new\n    (\n        virtual alu_if vif,\n        mailbox #(alu_transaction) drv2mon,\n        mailbox #(alu_transaction) mon2sb,\n        int n\n    );\n\n        this.vif     = vif;\n        this.drv2mon = drv2mon;\n        this.mon2sb  = mon2sb;\n        this.n       = n;\n\n    endfunction\n\n    task run();\n\n        alu_transaction tr;\n\n        repeat(n)\n        begin\n\n            drv2mon.get(tr);\n\n            tr.result = vif.result;\n\n            mon2sb.put(tr);\n\n        end\n\n    endtask\n\nendclass\n\nclass alu_scoreboard;\n\n    mailbox #(alu_transaction) mon2sb;\n\n    int n;\n    int pass = 0;\n    int fail = 0;\n\n    function new\n    (\n        mailbox #(alu_transaction) mon2sb,\n        int n\n    );\n\n        this.mon2sb = mon2sb;\n        this.n      = n;\n\n    endfunction\n\n    task run();\n\n        alu_transaction tr;\n\n        logic [7:0] exp_result;\n\n        repeat(n)\n        begin\n\n            mon2sb.get(tr);\n\n            case(tr.opcode)\n\n                3'b000:\n                    exp_result = tr.a + tr.b;\n\n                3'b001:\n                    exp_result = tr.a - tr.b;\n\n                3'b010:\n                    exp_result = tr.a & tr.b;\n\n                3'b011:\n                    exp_result = tr.a | tr.b;\n\n                3'b100:\n                    exp_result = tr.a ^ tr.b;\n\n                3'b101:\n                    exp_result = ~(tr.a & tr.b);\n\n                3'b110:\n                    exp_result = ~(tr.a | tr.b);\n\n                3'b111:\n                    exp_result = ~(tr.a ^ tr.b);\n\n            endcase\n\n            if(tr.result === exp_result)\n            begin\n\n                pass++;\n\n            end\n\n            else\n            begin\n\n                fail++;\n\n                $display(\n                    \"ERROR: A=%h B=%h OP=%b Expected=%h Actual=%h\",\n                    tr.a,\n                    tr.b,\n                    tr.opcode,\n                    exp_result,\n                    tr.result\n                );\n\n            end\n\n        end\n\n        $display(\"PASS = %0d | FAIL = %0d\", pass, fail);\n\n    endtask\n\nendclass\n\nclass alu_environment;\n\n    virtual alu_if vif;\n\n    mailbox #(alu_transaction) gen2drv;\n    mailbox #(alu_transaction) drv2mon;\n    mailbox #(alu_transaction) mon2sb;\n\n    alu_generator  gen;\n    alu_driver     drv;\n    alu_monitor    mon;\n    alu_scoreboard sb;\n\n    int n;\n\n    function new\n    (\n        virtual alu_if vif,\n        int n\n    );\n\n        this.vif = vif;\n        this.n   = n;\n\n        gen2drv = new();\n        drv2mon = new();\n        mon2sb  = new();\n\n        gen = new(\n            gen2drv,\n            n\n        );\n\n        drv = new(\n            vif,\n            gen2drv,\n            drv2mon,\n            n\n        );\n\n        mon = new(\n            vif,\n            drv2mon,\n            mon2sb,\n            n\n        );\n\n        sb = new(\n            mon2sb,\n            n\n        );\n\n    endfunction\n\n    task run();\n\n        fork\n\n            gen.run();\n            drv.run();\n            mon.run();\n            sb.run();\n\n        join\n\n    endtask\n\nendclass\n\nmodule tb_top;\n\n    parameter int N = 100;\n\n    alu_if intf();\n\n    alu_8bit dut\n    (\n        .a      (intf.a),\n        .b      (intf.b),\n        .opcode (intf.opcode),\n        .result (intf.result)\n    );\n\n    alu_environment env;\n\n    initial\n    begin\n\n        intf.a      = 8'b0;\n        intf.b      = 8'b0;\n        intf.opcode = 3'b0;\n\n        env = new(\n            intf,\n            N\n        );\n\n        env.run();\n\n        $finish;\n\n    end\n\nendmodule\n"
 },
 {
  "id": "axi4-lite",
  "title": "AXI4-Lite",
  "desc": "AXI4-Lite slave with interface + randomized HVL testbench.",
  "rtlFile": "rtl/top.sv",
  "tbFile": "tb/tb_top.sv",
  "rtl": "`timescale 1ns/1ps\n\nmodule axi4_lite_slave (\n    input  logic        aclk,\n    input  logic        aresetn,\n\n    input  logic [3:0]  awaddr,\n    input  logic        awvalid,\n    output logic        awready,\n\n    input  logic [31:0] wdata,\n    input  logic        wvalid,\n    output logic        wready,\n\n    output logic [1:0]  bresp,\n    output logic        bvalid,\n    input  logic        bready,\n\n    input  logic [3:0]  araddr,\n    input  logic        arvalid,\n    output logic        arready,\n\n    output logic [31:0] rdata,\n    output logic [1:0]  rresp,\n    output logic        rvalid,\n    input  logic        rready\n);\n\n    logic [31:0] register_file [0:15];\n    integer i;\n\n    always_ff @(posedge aclk) begin\n        if (!aresetn) begin\n            awready <= 1'b0;\n            wready  <= 1'b0;\n            bvalid  <= 1'b0;\n            bresp   <= 2'b00;\n            arready <= 1'b0;\n            rvalid  <= 1'b0;\n            rresp   <= 2'b00;\n            rdata   <= 32'h0000_0000;\n            for (i = 0; i < 16; i = i + 1)\n                register_file[i] <= 32'h0000_0000;\n        end\n        else begin\n\n            if (awvalid && wvalid) begin\n                awready               <= 1'b1;\n                wready                <= 1'b1;\n                register_file[awaddr] <= wdata;\n                bvalid                <= 1'b1;\n                bresp                 <= 2'b00;\n            end\n            else begin\n                awready <= 1'b0;\n                wready  <= 1'b0;\n                if (bready && bvalid)\n                    bvalid <= 1'b0;\n            end\n\n            if (arvalid) begin\n                arready <= 1'b1;\n                rdata   <= register_file[araddr];\n                rvalid  <= 1'b1;\n                rresp   <= 2'b00;\n            end\n            else begin\n                arready <= 1'b0;\n                if (rready && rvalid)\n                    rvalid <= 1'b0;\n            end\n        end\n    end\n\nendmodule\n",
  "tb": "`timescale 1ns/1ps\n\ninterface axi_if;\n\n    logic        clk;\n    logic        aresetn;\n\n    logic [3:0]  awaddr;\n    logic        awvalid;\n    logic        awready;\n\n    logic [31:0] wdata;\n    logic        wvalid;\n    logic        wready;\n\n    logic [1:0]  bresp;\n    logic        bvalid;\n    logic        bready;\n\n    logic [3:0]  araddr;\n    logic        arvalid;\n    logic        arready;\n\n    logic [31:0] rdata;\n    logic [1:0]  rresp;\n    logic        rvalid;\n    logic        rready;\n\nendinterface\n\nclass axi_transaction;\n\n    rand bit        write_en;\n    rand bit [3:0]  addr;\n    rand bit [31:0] wdata;\n\n    logic [31:0] rdata;\n    logic [1:0]  bresp;\n    logic [1:0]  rresp;\n    logic        bvalid;\n    logic        rvalid;\n\nendclass\n\nclass axi_generator;\n\n    mailbox #(axi_transaction) gen2drv;\n    int n;\n\n    function new\n    (\n        mailbox #(axi_transaction) gen2drv,\n        int n\n    );\n\n        this.gen2drv = gen2drv;\n        this.n       = n;\n\n    endfunction\n\n    task run();\n\n        axi_transaction tr;\n\n        repeat(n)\n        begin\n\n            tr = new();\n\n            if(!tr.randomize())\n                $display(\"Randomization failed\");\n\n            gen2drv.put(tr);\n\n        end\n\n    endtask\n\nendclass\n\nclass axi_driver;\n\n    virtual axi_if vif;\n\n    mailbox #(axi_transaction) gen2drv;\n\n    int n;\n\n    function new\n    (\n        virtual axi_if vif,\n        mailbox #(axi_transaction) gen2drv,\n        int n\n    );\n\n        this.vif     = vif;\n        this.gen2drv = gen2drv;\n        this.n       = n;\n\n    endfunction\n\n    task run();\n\n        axi_transaction tr;\n\n        repeat(n)\n        begin\n\n            gen2drv.get(tr);\n\n            @(negedge vif.clk);\n\n            if(tr.write_en)\n            begin\n                vif.awaddr  = tr.addr;\n                vif.awvalid = 1'b1;\n                vif.wdata   = tr.wdata;\n                vif.wvalid  = 1'b1;\n                vif.bready  = 1'b1;\n\n                vif.araddr  = 4'd0;\n                vif.arvalid = 1'b0;\n                vif.rready  = 1'b0;\n            end\n            else\n            begin\n                vif.araddr  = tr.addr;\n                vif.arvalid = 1'b1;\n                vif.rready  = 1'b1;\n\n                vif.awaddr  = 4'd0;\n                vif.awvalid = 1'b0;\n                vif.wdata   = 32'd0;\n                vif.wvalid  = 1'b0;\n                vif.bready  = 1'b0;\n            end\n\n        end\n\n    endtask\n\nendclass\n\nclass axi_monitor;\n\n    virtual axi_if vif;\n\n    mailbox #(axi_transaction) mon2sb;\n    int n;\n\n    function new\n    (\n        virtual axi_if vif,\n        mailbox #(axi_transaction) mon2sb,\n        int n\n    );\n\n        this.vif    = vif;\n        this.mon2sb = mon2sb;\n        this.n      = n;\n\n    endfunction\n\n    task run();\n\n        axi_transaction tr;\n\n        repeat(n)\n        begin\n\n            @(posedge vif.clk);\n\n            tr = new();\n            tr.write_en = (vif.awvalid && vif.wvalid);\n            tr.addr     = tr.write_en ? vif.awaddr : vif.araddr;\n            tr.wdata    = vif.wdata;\n\n            #1;\n\n            tr.rdata  = vif.rdata;\n            tr.bresp  = vif.bresp;\n            tr.rresp  = vif.rresp;\n            tr.bvalid = vif.bvalid;\n            tr.rvalid = vif.rvalid;\n            mon2sb.put(tr);\n\n        end\n\n    endtask\n\nendclass\n\nclass axi_scoreboard;\n\n    mailbox #(axi_transaction) mon2sb;\n\n    logic [31:0] ref_reg [0:15];\n\n    int n;\n    int pass = 0;\n    int fail = 0;\n\n    function new\n    (\n        mailbox #(axi_transaction) mon2sb,\n        int n\n    );\n\n        this.mon2sb = mon2sb;\n        this.n      = n;\n\n        for(int i = 0; i < 16; i++)\n            ref_reg[i] = 32'h0000_0000;\n\n    endfunction\n\n    task run();\n\n        axi_transaction tr;\n\n        repeat(n)\n        begin\n\n            mon2sb.get(tr);\n\n            if(tr.write_en)\n            begin\n\n                ref_reg[tr.addr] = tr.wdata;\n\n                if((tr.bvalid === 1'b1) && (tr.bresp === 2'b00))\n                    pass++;\n                else\n                begin\n                    fail++;\n                    $display(\"ERROR WRITE: ADDR=%h BVALID=%b BRESP=%b\", tr.addr, tr.bvalid, tr.bresp);\n                end\n\n            end\n\n            else\n            begin\n\n                if((tr.rvalid === 1'b1) &&\n                   (tr.rresp  === 2'b00) &&\n                   (tr.rdata  === ref_reg[tr.addr]))\n                begin\n\n                    pass++;\n\n                end\n\n                else\n                begin\n\n                    fail++;\n\n                    $display(\n                        \"ERROR READ: ADDR=%h Expected=%h Actual=%h\",\n                        tr.addr,\n                        ref_reg[tr.addr],\n                        tr.rdata\n                    );\n\n                end\n\n            end\n\n        end\n\n        $display(\"PASS = %0d | FAIL = %0d\", pass, fail);\n    endtask\n\nendclass\n\nclass axi_environment;\n\n    virtual axi_if vif;\n\n    mailbox #(axi_transaction) gen2drv;\n    mailbox #(axi_transaction) mon2sb;\n\n    axi_generator  gen;\n    axi_driver     drv;\n    axi_monitor    mon;\n    axi_scoreboard sb;\n    int n;\n\n    function new\n    (\n        virtual axi_if vif,\n        int n\n    );\n\n        this.vif = vif;\n        this.n   = n;\n\n        gen2drv = new();\n        mon2sb  = new();\n        gen = new(\n            gen2drv,\n            n\n        );\n\n        drv = new(\n            vif,\n            gen2drv,\n            n\n        );\n\n        mon = new(\n            vif,\n            mon2sb,\n            n\n        );\n\n        sb = new(\n            mon2sb,\n            n\n        );\n\n    endfunction\n\n    task run();\n\n        fork\n\n            gen.run();\n            drv.run();\n            mon.run();\n            sb.run();\n\n        join\n\n    endtask\n\nendclass\n\nmodule tb_top;\n\n    parameter int N = 100;\n\n    axi_if intf();\n\n    axi4_lite_slave dut\n    (\n        .aclk    (intf.clk),\n        .aresetn (intf.aresetn),\n        .awaddr  (intf.awaddr),\n        .awvalid (intf.awvalid),\n        .awready (intf.awready),\n        .wdata   (intf.wdata),\n        .wvalid  (intf.wvalid),\n        .wready  (intf.wready),\n        .bresp   (intf.bresp),\n        .bvalid  (intf.bvalid),\n        .bready  (intf.bready),\n        .araddr  (intf.araddr),\n        .arvalid (intf.arvalid),\n        .arready (intf.arready),\n        .rdata   (intf.rdata),\n        .rresp   (intf.rresp),\n        .rvalid  (intf.rvalid),\n        .rready  (intf.rready)\n    );\n\n    axi_environment env;\n\n    initial\n    begin\n\n        intf.clk = 0;\n\n        forever #5\n            intf.clk = ~intf.clk;\n\n    end\n\n    initial\n    begin\n\n        intf.aresetn = 0;\n        intf.awaddr  = 0;\n        intf.awvalid = 0;\n        intf.wdata   = 0;\n        intf.wvalid  = 0;\n        intf.bready  = 0;\n        intf.araddr  = 0;\n        intf.arvalid = 0;\n        intf.rready  = 0;\n\n        repeat(2)\n            @(posedge intf.clk);\n\n        #1;\n\n        intf.aresetn = 1;\n\n        env = new(\n            intf,\n            N\n        );\n\n        env.run();\n        $finish;\n\n    end\n\nendmodule\n"
 },
 {
  "id": "arbiter",
  "title": "Arbiter",
  "desc": "Fixed-priority arbiter with HVL testbench.",
  "rtlFile": "rtl/top.sv",
  "tbFile": "tb/tb_top.sv",
  "rtl": "`timescale 1ns/1ps\n\nmodule arbiter (\n    input  logic       clk,\n    input  logic       rst,\n    input  logic [3:0] req,\n    output logic [3:0] grant\n);\n\n    always_ff @(posedge clk) begin\n        if (rst) begin\n            grant <= 4'b0000;\n        end\n        else begin\n            casex (req)\n                4'b1xxx: grant <= 4'd8;\n                4'b01xx: grant <= 4'd4;\n                4'b001x: grant <= 4'd2;\n                4'b0001: grant <= 4'd1;\n                default: grant <= 4'd0;\n            endcase\n        end\n    end\n\nendmodule\n",
  "tb": "`timescale 1ns/1ps\n\ninterface arb_if;\n\n    logic       clk;\n    logic       rst;\n    logic [3:0] req;\n    logic [3:0] grant;\n\nendinterface\n\nclass arb_transaction;\n\n    rand bit [3:0] req;\n\n    logic [3:0] grant;\n\nendclass\n\nclass arb_generator;\n\n    mailbox #(arb_transaction) gen2drv;\n    int n;\n\n    function new\n    (\n        mailbox #(arb_transaction) gen2drv,\n        int n\n    );\n\n        this.gen2drv = gen2drv;\n        this.n       = n;\n\n    endfunction\n\n    task run();\n\n        arb_transaction tr;\n\n        repeat(n)\n        begin\n\n            tr = new();\n\n            if(!tr.randomize())\n                $display(\"Randomization failed\");\n\n            gen2drv.put(tr);\n\n        end\n\n    endtask\n\nendclass\n\nclass arb_driver;\n\n    virtual arb_if vif;\n\n    mailbox #(arb_transaction) gen2drv;\n\n    int n;\n\n    function new\n    (\n        virtual arb_if vif,\n        mailbox #(arb_transaction) gen2drv,\n        int n\n    );\n\n        this.vif     = vif;\n        this.gen2drv = gen2drv;\n        this.n       = n;\n\n    endfunction\n\n    task run();\n\n        arb_transaction tr;\n\n        repeat(n)\n        begin\n\n            gen2drv.get(tr);\n\n            @(negedge vif.clk);\n\n            vif.req = tr.req;\n\n        end\n\n    endtask\n\nendclass\n\nclass arb_monitor;\n\n    virtual arb_if vif;\n\n    mailbox #(arb_transaction) mon2sb;\n    int n;\n\n    function new\n    (\n        virtual arb_if vif,\n        mailbox #(arb_transaction) mon2sb,\n        int n\n    );\n\n        this.vif    = vif;\n        this.mon2sb = mon2sb;\n        this.n      = n;\n\n    endfunction\n\n    task run();\n\n        arb_transaction tr;\n\n        repeat(n)\n        begin\n\n            @(posedge vif.clk);\n\n            tr = new();\n            tr.req = vif.req;\n\n            #1;\n\n            tr.grant = vif.grant;\n            mon2sb.put(tr);\n\n        end\n\n    endtask\n\nendclass\n\nclass arb_scoreboard;\n\n    mailbox #(arb_transaction) mon2sb;\n\n    int n;\n    int pass = 0;\n    int fail = 0;\n\n    function new\n    (\n        mailbox #(arb_transaction) mon2sb,\n        int n\n    );\n\n        this.mon2sb = mon2sb;\n        this.n      = n;\n\n    endfunction\n\n    task run();\n\n        arb_transaction tr;\n        logic [3:0] exp_grant;\n\n        repeat(n)\n        begin\n\n            mon2sb.get(tr);\n\n            casex(tr.req)\n                4'b1xxx: exp_grant = 4'd8;\n                4'b01xx: exp_grant = 4'd4;\n                4'b001x: exp_grant = 4'd2;\n                4'b0001: exp_grant = 4'd1;\n                default: exp_grant = 4'd0;\n            endcase\n\n            if(tr.grant === exp_grant)\n            begin\n\n                pass++;\n\n            end\n\n            else\n            begin\n\n                fail++;\n\n                $display(\n                    \"ERROR: REQ=%b Expected=%b Actual=%b\",\n                    tr.req,\n                    exp_grant,\n                    tr.grant\n                );\n\n            end\n\n        end\n\n        $display(\"PASS = %0d | FAIL = %0d\", pass, fail);\n    endtask\n\nendclass\n\nclass arb_environment;\n\n    virtual arb_if vif;\n\n    mailbox #(arb_transaction) gen2drv;\n    mailbox #(arb_transaction) mon2sb;\n\n    arb_generator  gen;\n    arb_driver     drv;\n    arb_monitor    mon;\n    arb_scoreboard sb;\n    int n;\n\n    function new\n    (\n        virtual arb_if vif,\n        int n\n    );\n\n        this.vif = vif;\n        this.n   = n;\n\n        gen2drv = new();\n        mon2sb  = new();\n        gen = new(\n            gen2drv,\n            n\n        );\n\n        drv = new(\n            vif,\n            gen2drv,\n            n\n        );\n\n        mon = new(\n            vif,\n            mon2sb,\n            n\n        );\n\n        sb = new(\n            mon2sb,\n            n\n        );\n\n    endfunction\n\n    task run();\n\n        fork\n\n            gen.run();\n            drv.run();\n            mon.run();\n            sb.run();\n\n        join\n\n    endtask\n\nendclass\n\nmodule tb_top;\n\n    parameter int N = 100;\n\n    arb_if intf();\n\n    arbiter dut\n    (\n        .clk   (intf.clk),\n        .rst   (intf.rst),\n        .req   (intf.req),\n        .grant (intf.grant)\n    );\n\n    arb_environment env;\n\n    initial\n    begin\n\n        intf.clk = 0;\n\n        forever #5\n            intf.clk = ~intf.clk;\n\n    end\n\n    initial\n    begin\n\n        intf.rst = 1;\n        intf.req = 0;\n\n        repeat(2)\n            @(posedge intf.clk);\n\n        #1;\n\n        intf.rst = 0;\n\n        env = new(\n            intf,\n            N\n        );\n\n        env.run();\n        $finish;\n\n    end\n\nendmodule\n"
 },
 {
  "id": "fifo",
  "title": "FIFO",
  "desc": "Synchronous FIFO with HVL testbench.",
  "rtlFile": "rtl/top.sv",
  "tbFile": "tb/tb_top.sv",
  "rtl": "`timescale 1ns/1ps\n\nmodule synchronous_fifo #(\n    parameter DATA_WIDTH = 4,\n    parameter DEPTH      = 4,\n    parameter PTR_WIDTH  = $clog2(DEPTH)\n)(\n    input  logic                  clk,\n    input  logic                  rst,\n    input  logic                  wr_en,\n    input  logic                  rd_en,\n    input  logic [DATA_WIDTH-1:0] data_in,\n    output logic [DATA_WIDTH-1:0] data_out,\n    output logic                  full,\n    output logic                  empty\n);\n\n    logic [DATA_WIDTH-1:0] memory [0:DEPTH-1];\n    logic [PTR_WIDTH-1:0]  wr_ptr;\n    logic [PTR_WIDTH-1:0]  rd_ptr;\n    logic [$clog2(DEPTH+1)-1:0] count;\n    integer i;\n\n    always_comb begin\n        full  = (count == DEPTH);\n        empty = (count == 0);\n    end\n\n    always_ff @(posedge clk) begin\n        if (rst) begin\n            wr_ptr   <= '0;\n            rd_ptr   <= '0;\n            count    <= '0;\n            data_out <= '0;\n            for (i = 0; i < DEPTH; i = i + 1)\n                memory[i] <= '0;\n        end\n        else begin\n            if (wr_en && !full) begin\n                memory[wr_ptr] <= data_in;\n                if (wr_ptr == DEPTH - 1)\n                    wr_ptr <= '0;\n                else\n                    wr_ptr <= wr_ptr + 1'b1;\n            end\n\n            if (rd_en && !empty) begin\n                data_out <= memory[rd_ptr];\n                if (rd_ptr == DEPTH - 1)\n                    rd_ptr <= '0;\n                else\n                    rd_ptr <= rd_ptr + 1'b1;\n            end\n\n            case ({(wr_en && !full), (rd_en && !empty)})\n                2'b10:   count <= count + 1'b1;\n                2'b01:   count <= count - 1'b1;\n                2'b11:   count <= count;\n                default: count <= count;\n            endcase\n        end\n    end\n\nendmodule\n",
  "tb": "`timescale 1ns/1ps\n\ninterface fifo_if;\n\n    logic       clk;\n    logic       rst;\n    logic       wr_en;\n    logic       rd_en;\n    logic [3:0] data_in;\n\n    logic [3:0] data_out;\n    logic       full;\n    logic       empty;\n\nendinterface\n\nclass fifo_transaction;\n\n    rand bit       wr_en;\n    rand bit       rd_en;\n    rand bit [3:0] data_in;\n\n    logic [3:0] data_out;\n    logic       full;\n    logic       empty;\n\nendclass\n\nclass fifo_generator;\n\n    mailbox #(fifo_transaction) gen2drv;\n    int n;\n\n    function new\n    (\n        mailbox #(fifo_transaction) gen2drv,\n        int n\n    );\n\n        this.gen2drv = gen2drv;\n        this.n       = n;\n\n    endfunction\n\n    task run();\n\n        fifo_transaction tr;\n\n        repeat(n)\n        begin\n\n            tr = new();\n\n            if(!tr.randomize())\n                $display(\"Randomization failed\");\n\n            gen2drv.put(tr);\n\n        end\n\n    endtask\n\nendclass\n\nclass fifo_driver;\n\n    virtual fifo_if vif;\n\n    mailbox #(fifo_transaction) gen2drv;\n\n    int n;\n\n    function new\n    (\n        virtual fifo_if vif,\n        mailbox #(fifo_transaction) gen2drv,\n        int n\n    );\n\n        this.vif     = vif;\n        this.gen2drv = gen2drv;\n        this.n       = n;\n\n    endfunction\n\n    task run();\n\n        fifo_transaction tr;\n\n        repeat(n)\n        begin\n\n            gen2drv.get(tr);\n\n            @(negedge vif.clk);\n\n            vif.wr_en   = tr.wr_en;\n            vif.rd_en   = tr.rd_en;\n            vif.data_in = tr.data_in;\n\n        end\n\n    endtask\n\nendclass\n\nclass fifo_monitor;\n\n    virtual fifo_if vif;\n\n    mailbox #(fifo_transaction) mon2sb;\n    int n;\n\n    function new\n    (\n        virtual fifo_if vif,\n        mailbox #(fifo_transaction) mon2sb,\n        int n\n    );\n\n        this.vif    = vif;\n        this.mon2sb = mon2sb;\n        this.n      = n;\n\n    endfunction\n\n    task run();\n\n        fifo_transaction tr;\n\n        repeat(n)\n        begin\n\n            @(posedge vif.clk);\n\n            tr = new();\n            tr.wr_en   = vif.wr_en;\n            tr.rd_en   = vif.rd_en;\n            tr.data_in = vif.data_in;\n\n            #1;\n\n            tr.data_out = vif.data_out;\n            tr.full     = vif.full;\n            tr.empty    = vif.empty;\n            mon2sb.put(tr);\n\n        end\n\n    endtask\n\nendclass\n\nclass fifo_scoreboard;\n\n    mailbox #(fifo_transaction) mon2sb;\n\n    bit [3:0] ref_q[$];\n\n    int n;\n    int pass = 0;\n    int fail = 0;\n\n    function new\n    (\n        mailbox #(fifo_transaction) mon2sb,\n        int n\n    );\n\n        this.mon2sb = mon2sb;\n        this.n      = n;\n\n    endfunction\n\n    task run();\n\n        fifo_transaction tr;\n\n        bit [3:0] exp_data;\n\n        bit do_write;\n        bit do_read;\n\n        bit exp_full;\n        bit exp_empty;\n\n        int size_before;\n\n        repeat(n)\n        begin\n\n            mon2sb.get(tr);\n\n            size_before = ref_q.size();\n\n            do_write =\n                tr.wr_en && (size_before < 4);\n\n            do_read =\n                tr.rd_en && (size_before > 0);\n\n            if(do_read)\n                exp_data = ref_q.pop_front();\n\n            if(do_write)\n                ref_q.push_back(tr.data_in);\n\n            exp_full  = (ref_q.size() == 4);\n            exp_empty = (ref_q.size() == 0);\n\n            if((tr.full  === exp_full)  &&\n               (tr.empty === exp_empty) &&\n               (!do_read ||\n                (tr.data_out === exp_data)))\n            begin\n\n                pass++;\n\n            end\n\n            else\n            begin\n\n                fail++;\n\n                $display(\n                    \"ERROR: WR=%b RD=%b DIN=%h DOUT=%h FULL=%b EMPTY=%b\",\n                    tr.wr_en,\n                    tr.rd_en,\n                    tr.data_in,\n                    tr.data_out,\n                    tr.full,\n                    tr.empty\n                );\n\n            end\n\n        end\n\n        $display(\"PASS = %0d | FAIL = %0d\", pass, fail);\n    endtask\n\nendclass\n\nclass fifo_environment;\n\n    virtual fifo_if vif;\n\n    mailbox #(fifo_transaction) gen2drv;\n    mailbox #(fifo_transaction) mon2sb;\n\n    fifo_generator  gen;\n    fifo_driver     drv;\n    fifo_monitor    mon;\n    fifo_scoreboard sb;\n    int n;\n\n    function new\n    (\n        virtual fifo_if vif,\n        int n\n    );\n\n        this.vif = vif;\n        this.n   = n;\n\n        gen2drv = new();\n        mon2sb  = new();\n        gen = new(\n            gen2drv,\n            n\n        );\n\n        drv = new(\n            vif,\n            gen2drv,\n            n\n        );\n\n        mon = new(\n            vif,\n            mon2sb,\n            n\n        );\n\n        sb = new(\n            mon2sb,\n            n\n        );\n\n    endfunction\n\n    task run();\n\n        fork\n\n            gen.run();\n            drv.run();\n            mon.run();\n            sb.run();\n\n        join\n\n    endtask\n\nendclass\n\nmodule tb_top;\n\n    parameter int N = 100;\n\n    fifo_if intf();\n\n    synchronous_fifo dut\n    (\n        .clk      (intf.clk),\n        .rst      (intf.rst),\n        .wr_en    (intf.wr_en),\n        .rd_en    (intf.rd_en),\n        .data_in  (intf.data_in),\n        .data_out (intf.data_out),\n        .full     (intf.full),\n        .empty    (intf.empty)\n    );\n\n    fifo_environment env;\n\n    initial\n    begin\n\n        intf.clk = 0;\n\n        forever #5\n            intf.clk = ~intf.clk;\n\n    end\n\n    initial\n    begin\n\n        intf.rst     = 1;\n        intf.wr_en   = 0;\n        intf.rd_en   = 0;\n        intf.data_in = 0;\n\n        repeat(2)\n            @(posedge intf.clk);\n\n        #1;\n\n        intf.rst = 0;\n\n        env = new(\n            intf,\n            N\n        );\n\n        env.run();\n        $finish;\n\n    end\n\nendmodule\n"
 },
 {

  "rtl": "`timescale 1ns/1ps\n\nmodule fsm_dut (\n    input  logic       clk,\n    input  logic       rst,\n    input  logic       in,\n    output logic       out,\n    output logic [1:0] state\n);\n\n    typedef enum logic [1:0] {\n        IDLE = 2'b00,\n        LOAD = 2'b01,\n        DONE = 2'b10\n    } state_t;\n\n    state_t current_state, next_state;\n\n    always_ff @(posedge clk or posedge rst) begin\n        if (rst) begin\n            current_state <= IDLE;\n        end\n        else begin\n            current_state <= next_state;\n        end\n    end\n\n    always_comb begin\n        case (current_state)\n            IDLE: begin\n                if (in)\n                    next_state = LOAD;\n                else\n                    next_state = IDLE;\n            end\n\n            LOAD: begin\n                if (in)\n                    next_state = DONE;\n                else\n                    next_state = IDLE;\n            end\n\n            DONE: begin\n                if (!in)\n                    next_state = IDLE;\n                else\n                    next_state = DONE;\n            end\n\n            default: next_state = IDLE;\n        endcase\n    end\n\n    assign out   = (current_state == DONE);\n    assign state = current_state;\n\nendmodule\n",
  "tb": "`timescale 1ns/1ps\n\ninterface fsm_if;\n\n    logic       clk;\n    logic       rst;\n    logic       in;\n    logic       out;\n    logic [1:0] state;\n\nendinterface\n\nclass fsm_transaction;\n\n    rand bit in;\n\n    logic       out;\n    logic [1:0] state;\n\nendclass\n\nclass fsm_generator;\n\n    mailbox #(fsm_transaction) gen2drv;\n    int n;\n\n    function new\n    (\n        mailbox #(fsm_transaction) gen2drv,\n        int n\n    );\n\n        this.gen2drv = gen2drv;\n        this.n       = n;\n\n    endfunction\n\n    task run();\n\n        fsm_transaction tr;\n\n        repeat(n)\n        begin\n\n            tr = new();\n\n            if(!tr.randomize())\n                $display(\"Randomization failed\");\n\n            gen2drv.put(tr);\n\n        end\n\n    endtask\n\nendclass\n\nclass fsm_driver;\n\n    virtual fsm_if vif;\n\n    mailbox #(fsm_transaction) gen2drv;\n\n    int n;\n\n    function new\n    (\n        virtual fsm_if vif,\n        mailbox #(fsm_transaction) gen2drv,\n        int n\n    );\n\n        this.vif     = vif;\n        this.gen2drv = gen2drv;\n        this.n       = n;\n\n    endfunction\n\n    task run();\n\n        fsm_transaction tr;\n\n        repeat(n)\n        begin\n\n            gen2drv.get(tr);\n\n            @(negedge vif.clk);\n\n            vif.in = tr.in;\n\n        end\n\n    endtask\n\nendclass\n\nclass fsm_monitor;\n\n    virtual fsm_if vif;\n\n    mailbox #(fsm_transaction) mon2sb;\n    int n;\n\n    function new\n    (\n        virtual fsm_if vif,\n        mailbox #(fsm_transaction) mon2sb,\n        int n\n    );\n\n        this.vif    = vif;\n        this.mon2sb = mon2sb;\n        this.n      = n;\n\n    endfunction\n\n    task run();\n\n        fsm_transaction tr;\n\n        repeat(n)\n        begin\n\n            @(posedge vif.clk);\n\n            tr = new();\n            tr.in = vif.in;\n\n            #1;\n\n            tr.state = vif.state;\n            tr.out   = vif.out;\n            mon2sb.put(tr);\n\n        end\n\n    endtask\n\nendclass\n\nclass fsm_scoreboard;\n\n    mailbox #(fsm_transaction) mon2sb;\n\n    logic [1:0] exp_state = 2'b00;\n\n    int n;\n    int pass = 0;\n    int fail = 0;\n\n    function new\n    (\n        mailbox #(fsm_transaction) mon2sb,\n        int n\n    );\n\n        this.mon2sb = mon2sb;\n        this.n      = n;\n\n    endfunction\n\n    task run();\n\n        fsm_transaction tr;\n        logic exp_out;\n\n        repeat(n)\n        begin\n\n            mon2sb.get(tr);\n\n            case(exp_state)\n                2'b00:   exp_state = tr.in ? 2'b01 : 2'b00;\n                2'b01:   exp_state = tr.in ? 2'b10 : 2'b00;\n                2'b10:   exp_state = tr.in ? 2'b10 : 2'b00;\n                default: exp_state = 2'b00;\n            endcase\n\n            exp_out = (exp_state == 2'b10);\n\n            if((tr.state === exp_state) && (tr.out === exp_out))\n            begin\n\n                pass++;\n\n            end\n\n            else\n            begin\n\n                fail++;\n\n                $display(\n                    \"ERROR: IN=%b Expected_State=%b,Out=%b Actual_State=%b,Out=%b\",\n                    tr.in,\n                    exp_state,\n                    exp_out,\n                    tr.state,\n                    tr.out\n                );\n\n            end\n\n        end\n\n        $display(\"PASS = %0d | FAIL = %0d\", pass, fail);\n    endtask\n\nendclass\n\nclass fsm_environment;\n\n    virtual fsm_if vif;\n\n    mailbox #(fsm_transaction) gen2drv;\n    mailbox #(fsm_transaction) mon2sb;\n\n    fsm_generator  gen;\n    fsm_driver     drv;\n    fsm_monitor    mon;\n    fsm_scoreboard sb;\n    int n;\n\n    function new\n    (\n        virtual fsm_if vif,\n        int n\n    );\n\n        this.vif = vif;\n        this.n   = n;\n\n        gen2drv = new();\n        mon2sb  = new();\n        gen = new(\n            gen2drv,\n            n\n        );\n\n        drv = new(\n            vif,\n            gen2drv,\n            n\n        );\n\n        mon = new(\n            vif,\n            mon2sb,\n            n\n        );\n\n        sb = new(\n            mon2sb,\n            n\n        );\n\n    endfunction\n\n    task run();\n\n        fork\n\n            gen.run();\n            drv.run();\n            mon.run();\n            sb.run();\n\n        join\n\n    endtask\n\nendclass\n\nmodule tb_top;\n\n    parameter int N = 100;\n\n    fsm_if intf();\n\n    fsm_dut dut\n    (\n        .clk   (intf.clk),\n        .rst   (intf.rst),\n        .in    (intf.in),\n        .out   (intf.out),\n        .state (intf.state)\n    );\n\n    fsm_environment env;\n\n    initial\n    begin\n\n        intf.clk = 0;\n\n        forever #5\n            intf.clk = ~intf.clk;\n\n    end\n\n    initial\n    begin\n\n        intf.rst = 1;\n        intf.in  = 0;\n\n        repeat(2)\n            @(posedge intf.clk);\n\n        #1;\n\n        intf.rst = 0;\n\n        env = new(\n            intf,\n            N\n        );\n\n        env.run();\n        $finish;\n\n    end\n\nendmodule\n"
 },
