  "id": "uart",
  "title": "UART",
  "desc": "UART TX/RX with HVL testbench.",
  "rtlFile": "rtl/top.sv",
  "tbFile": "tb/tb_top.sv",
  "rtl": "`timescale 1ns/1ps\n\nmodule uart_top #(\n    parameter CLK_FREQ  = 96000,\n    parameter BAUD_RATE = 9600\n)(\n    input  logic       clk,\n    input  logic       rst,\n    input  logic       tx_start,\n    input  logic [7:0] tx_data,\n    input  logic       rx,\n    output logic       tx,\n    output logic [7:0] rx_data,\n    output logic       tx_done,\n    output logic       rx_done\n);\n\n    localparam CLKS_PER_BIT = CLK_FREQ / BAUD_RATE;\n\n    typedef enum logic [1:0] {\n        IDLE  = 2'b00,\n        START = 2'b01,\n        DATA  = 2'b10,\n        STOP  = 2'b11\n    } state_t;\n\n    state_t      tx_state, rx_state;\n    logic [2:0]  tx_idx, rx_idx;\n    logic [7:0]  tx_reg, rx_reg;\n    logic [15:0] baud_cnt;\n    logic        baud_tick;\n\n    always_ff @(posedge clk or posedge rst) begin\n        if (rst) begin\n            baud_cnt  <= 16'd0;\n            baud_tick <= 1'b0;\n        end\n        else if (baud_cnt == CLKS_PER_BIT - 1) begin\n            baud_cnt  <= 16'd0;\n            baud_tick <= 1'b1;\n        end\n        else begin\n            baud_cnt  <= baud_cnt + 1'b1;\n            baud_tick <= 1'b0;\n        end\n    end\n\n    always_ff @(posedge clk or posedge rst) begin\n        if (rst) begin\n            tx_state <= IDLE;\n            tx       <= 1'b1;\n            tx_done  <= 1'b0;\n            tx_idx   <= 3'd0;\n            tx_reg   <= 8'h00;\n        end\n        else begin\n            tx_done <= 1'b0;\n            case (tx_state)\n                IDLE: begin\n                    tx     <= 1'b1;\n                    tx_idx <= 3'd0;\n                    if (tx_start) begin\n                        tx_reg   <= tx_data;\n                        tx_state <= START;\n                    end\n                end\n\n                START: begin\n                    if (baud_tick) begin\n                        tx       <= 1'b0;\n                        tx_state <= DATA;\n                    end\n                end\n\n                DATA: begin\n                    if (baud_tick) begin\n                        tx <= tx_reg[tx_idx];\n                        if (tx_idx == 3'd7) begin\n                            tx_idx   <= 3'd0;\n                            tx_state <= STOP;\n                        end\n                        else begin\n                            tx_idx <= tx_idx + 1'b1;\n                        end\n                    end\n                end\n\n                STOP: begin\n                    if (baud_tick) begin\n                        tx       <= 1'b1;\n                        tx_done  <= 1'b1;\n                        tx_state <= IDLE;\n                    end\n                end\n\n                default: tx_state <= IDLE;\n            endcase\n        end\n    end\n\n    always_ff @(posedge clk or posedge rst) begin\n        if (rst) begin\n            rx_state <= IDLE;\n            rx_data  <= 8'h00;\n            rx_done  <= 1'b0;\n            rx_idx   <= 3'd0;\n            rx_reg   <= 8'h00;\n        end\n        else begin\n            rx_done <= 1'b0;\n            case (rx_state)\n                IDLE: begin\n                    rx_idx <= 3'd0;\n                    if (baud_tick && rx == 1'b0) begin\n                        rx_state <= DATA;\n                    end\n                end\n\n                DATA: begin\n                    if (baud_tick) begin\n                        rx_reg[rx_idx] <= rx;\n                        if (rx_idx == 3'd7) begin\n                            rx_idx   <= 3'd0;\n                            rx_state <= STOP;\n                        end\n                        else begin\n                            rx_idx <= rx_idx + 1'b1;\n                        end\n                    end\n                end\n\n                STOP: begin\n                    if (baud_tick) begin\n                        if (rx == 1'b1) begin\n                            rx_data <= rx_reg;\n                            rx_done <= 1'b1;\n                        end\n                        rx_state <= IDLE;\n                    end\n                end\n\n                default: rx_state <= IDLE;\n            endcase\n        end\n    end\n\nendmodule\n",
  "tb": "`timescale 1ns/1ps\n\ninterface uart_if (input logic clk);\n    logic       rst;\n    logic       tx_start;\n    logic [7:0] tx_data;\n    logic       rx;\n    logic       tx;\n    logic [7:0] rx_data;\n    logic       tx_done;\n    logic       rx_done;\nendinterface\n\nclass transaction;\n    rand bit [7:0] tx_data;\n    logic    [7:0] rx_data;\n    logic          tx_done;\n    logic          rx_done;\nendclass\n\nclass generator;\n    mailbox #(transaction) gen2drv;\n    int n;\n\n    function new(mailbox #(transaction) gen2drv, int n);\n        this.gen2drv = gen2drv;\n        this.n       = n;\n    endfunction\n\n    task run();\n        transaction tr;\n        repeat (n) begin\n            tr = new();\n            if (!tr.randomize())\n                $display(\"Randomization failed\");\n            gen2drv.put(tr);\n        end\n    endtask\nendclass\n\nclass driver;\n    virtual uart_if vif;\n    mailbox #(transaction) gen2drv;\n    int n;\n\n    function new(virtual uart_if vif, mailbox #(transaction) gen2drv, int n);\n        this.vif     = vif;\n        this.gen2drv = gen2drv;\n        this.n       = n;\n    endfunction\n\n    task run();\n        transaction tr;\n        vif.tx_start = 1'b0;\n        vif.tx_data  = 8'h00;\n        repeat (n) begin\n            gen2drv.get(tr);\n            @(negedge vif.clk);\n            vif.tx_data  = tr.tx_data;\n            vif.tx_start = 1'b1;\n            @(negedge vif.clk);\n            vif.tx_start = 1'b0;\n            @(posedge vif.rx_done);\n        end\n    endtask\nendclass\n\nclass monitor;\n    virtual uart_if vif;\n    mailbox #(transaction) mon2scb;\n    int n;\n\n    function new(virtual uart_if vif, mailbox #(transaction) mon2scb, int n);\n        this.vif     = vif;\n        this.mon2scb = mon2scb;\n        this.n       = n;\n    endfunction\n\n    task run();\n        transaction tr;\n        repeat (n) begin\n            @(posedge vif.clk);\n            #1;\n            while (!vif.rx_done) begin\n                @(posedge vif.clk);\n                #1;\n            end\n            tr = new();\n            tr.tx_data = vif.tx_data;\n            tr.rx_data = vif.rx_data;\n            tr.tx_done = vif.tx_done;\n            tr.rx_done = vif.rx_done;\n            mon2scb.put(tr);\n        end\n    endtask\nendclass\n\nclass scoreboard;\n    mailbox #(transaction) mon2scb;\n    int n;\n    int pass_cnt = 0;\n    int fail_cnt = 0;\n\n    function new(mailbox #(transaction) mon2scb, int n);\n        this.mon2scb = mon2scb;\n        this.n       = n;\n    endfunction\n\n    task run();\n        transaction tr;\n        repeat (n) begin\n            mon2scb.get(tr);\n            if (tr.rx_data === tr.tx_data && tr.rx_done === 1'b1)\n                pass_cnt++;\n            else begin\n                fail_cnt++;\n                $display(\"FAIL: exp=%0h act=%0h\", tr.tx_data, tr.rx_data);\n            end\n        end\n        $display(\"PASS = %0d | FAIL = %0d\", pass_cnt, fail_cnt);\n    endtask\nendclass\n\nclass environment;\n    generator  gen;\n    driver     drv;\n    monitor    mon;\n    scoreboard scb;\n    mailbox #(transaction) gen2drv;\n    mailbox #(transaction) mon2scb;\n    virtual uart_if vif;\n    int n;\n\n    function new(virtual uart_if vif, int n);\n        this.vif = vif;\n        this.n   = n;\n        gen2drv  = new();\n        mon2scb  = new();\n        gen      = new(gen2drv, n);\n        drv      = new(vif, gen2drv, n);\n        mon      = new(vif, mon2scb, n);\n        scb      = new(mon2scb, n);\n    endfunction\n\n    task run();\n        fork\n            gen.run();\n            drv.run();\n            mon.run();\n            scb.run();\n        join\n    endtask\nendclass\n\nmodule tb_top;\n    logic clk = 0;\n    always #5 clk = ~clk;\n\n    uart_if intf(clk);\n\n    uart_top #(\n        .CLK_FREQ  (96000),\n        .BAUD_RATE (9600)\n    ) dut (\n        .clk      (intf.clk),\n        .rst      (intf.rst),\n        .tx_start (intf.tx_start),\n        .tx_data  (intf.tx_data),\n        .rx       (intf.tx),\n        .tx       (intf.tx),\n        .rx_data  (intf.rx_data),\n        .tx_done  (intf.tx_done),\n        .rx_done  (intf.rx_done)\n    );\n\n    environment env;\n\n    initial begin\n        intf.rst      = 1;\n        intf.tx_start = 0;\n        intf.tx_data  = 0;\n        repeat (2) @(posedge clk);\n        #1;\n        intf.rst = 0;\n\n        env = new(intf, 100);\n        env.run();\n        #20;\n        $finish;\n    end\nendmodule\n"
 },
 {
  "id": "usr",
  "title": "Universal Shift Register",
  "desc": "Universal shift register with HVL testbench.",
  "rtlFile": "rtl/top.sv",
  "tbFile": "tb/tb_top.sv",
  "rtl": "`timescale 1ns/1ps\n\nmodule universal_shift_register (\n    input  logic       clk,\n    input  logic       rst,\n    input  logic [1:0] sel,\n    input  logic       sin_left,\n    input  logic       sin_right,\n    input  logic [3:0] pdata,\n    output logic [3:0] q\n);\n\n    always_ff @(posedge clk or posedge rst) begin\n        if (rst) begin\n            q <= 4'b0000;\n        end\n        else begin\n            case (sel)\n                2'b00:   q <= q;\n                2'b01:   q <= {sin_left, q[3:1]};\n                2'b10:   q <= {q[2:0], sin_right};\n                2'b11:   q <= pdata;\n                default: q <= q;\n            endcase\n        end\n    end\n\nendmodule\n",
  "tb": "`timescale 1ns/1ps\n\ninterface usr_if;\n\n    logic       clk;\n    logic       rst;\n    logic [1:0] sel;\n    logic       sin_left;\n    logic       sin_right;\n    logic [3:0] pdata;\n    logic [3:0] q;\n\nendinterface\n\nclass usr_transaction;\n\n    rand bit [1:0] sel;\n    rand bit       sin_left;\n    rand bit       sin_right;\n    rand bit [3:0] pdata;\n\n    logic [3:0] q;\n\nendclass\n\nclass usr_generator;\n\n    mailbox #(usr_transaction) gen2drv;\n    int n;\n\n    function new\n    (\n        mailbox #(usr_transaction) gen2drv,\n        int n\n    );\n\n        this.gen2drv = gen2drv;\n        this.n       = n;\n\n    endfunction\n\n    task run();\n\n        usr_transaction tr;\n\n        repeat(n)\n        begin\n\n            tr = new();\n\n            if(!tr.randomize())\n                $display(\"Randomization failed\");\n\n            gen2drv.put(tr);\n\n        end\n\n    endtask\n\nendclass\n\nclass usr_driver;\n\n    virtual usr_if vif;\n\n    mailbox #(usr_transaction) gen2drv;\n\n    int n;\n\n    function new\n    (\n        virtual usr_if vif,\n        mailbox #(usr_transaction) gen2drv,\n        int n\n    );\n\n        this.vif     = vif;\n        this.gen2drv = gen2drv;\n        this.n       = n;\n\n    endfunction\n\n    task run();\n\n        usr_transaction tr;\n\n        repeat(n)\n        begin\n\n            gen2drv.get(tr);\n\n            @(negedge vif.clk);\n\n            vif.sel       = tr.sel;\n            vif.sin_left  = tr.sin_left;\n            vif.sin_right = tr.sin_right;\n            vif.pdata     = tr.pdata;\n\n        end\n\n    endtask\n\nendclass\n\nclass usr_monitor;\n\n    virtual usr_if vif;\n\n    mailbox #(usr_transaction) mon2sb;\n    int n;\n\n    function new\n    (\n        virtual usr_if vif,\n        mailbox #(usr_transaction) mon2sb,\n        int n\n    );\n\n        this.vif    = vif;\n        this.mon2sb = mon2sb;\n        this.n      = n;\n\n    endfunction\n\n    task run();\n\n        usr_transaction tr;\n\n        repeat(n)\n        begin\n\n            @(posedge vif.clk);\n\n            tr = new();\n            tr.sel       = vif.sel;\n            tr.sin_left  = vif.sin_left;\n            tr.sin_right = vif.sin_right;\n            tr.pdata     = vif.pdata;\n\n            #1;\n\n            tr.q = vif.q;\n            mon2sb.put(tr);\n\n        end\n\n    endtask\n\nendclass\n\nclass usr_scoreboard;\n\n    mailbox #(usr_transaction) mon2sb;\n\n    logic [3:0] exp_q = 4'b0000;\n\n    int n;\n    int pass = 0;\n    int fail = 0;\n\n    function new\n    (\n        mailbox #(usr_transaction) mon2sb,\n        int n\n    );\n\n        this.mon2sb = mon2sb;\n        this.n      = n;\n\n    endfunction\n\n    task run();\n\n        usr_transaction tr;\n\n        repeat(n)\n        begin\n\n            mon2sb.get(tr);\n\n            case(tr.sel)\n\n                2'b00:\n                    exp_q = exp_q;\n\n                2'b01:\n                    exp_q = {tr.sin_left, exp_q[3:1]};\n\n                2'b10:\n                    exp_q = {exp_q[2:0], tr.sin_right};\n\n                2'b11:\n                    exp_q = tr.pdata;\n\n            endcase\n\n            if(tr.q === exp_q)\n            begin\n\n                pass++;\n\n            end\n\n            else\n            begin\n\n                fail++;\n\n                $display(\n                    \"ERROR: SEL=%b PDATA=%b Expected=%b Actual=%b\",\n                    tr.sel,\n                    tr.pdata,\n                    exp_q,\n                    tr.q\n                );\n\n            end\n\n        end\n\n        $display(\"PASS = %0d | FAIL = %0d\", pass, fail);\n    endtask\n\nendclass\n\nclass usr_environment;\n\n    virtual usr_if vif;\n\n    mailbox #(usr_transaction) gen2drv;\n    mailbox #(usr_transaction) mon2sb;\n\n    usr_generator  gen;\n    usr_driver     drv;\n    usr_monitor    mon;\n    usr_scoreboard sb;\n    int n;\n\n    function new\n    (\n        virtual usr_if vif,\n        int n\n    );\n\n        this.vif = vif;\n        this.n   = n;\n\n        gen2drv = new();\n        mon2sb  = new();\n        gen = new(\n            gen2drv,\n            n\n        );\n\n        drv = new(\n            vif,\n            gen2drv,\n            n\n        );\n\n        mon = new(\n            vif,\n            mon2sb,\n            n\n        );\n\n        sb = new(\n            mon2sb,\n            n\n        );\n\n    endfunction\n\n    task run();\n\n        fork\n\n            gen.run();\n            drv.run();\n            mon.run();\n            sb.run();\n\n        join\n\n    endtask\n\nendclass\n\nmodule tb_top;\n\n    parameter int N = 100;\n\n    usr_if intf();\n\n    universal_shift_register dut\n    (\n        .clk       (intf.clk),\n        .rst       (intf.rst),\n        .sel       (intf.sel),\n        .sin_left  (intf.sin_left),\n        .sin_right (intf.sin_right),\n        .pdata     (intf.pdata),\n        .q         (intf.q)\n    );\n\n    usr_environment env;\n\n    initial\n    begin\n\n        intf.clk = 0;\n\n        forever #5\n            intf.clk = ~intf.clk;\n\n    end\n\n    initial\n    begin\n\n        intf.rst       = 1;\n        intf.sel       = 0;\n        intf.sin_left  = 0;\n        intf.sin_right = 0;\n        intf.pdata     = 0;\n\n        repeat(2)\n            @(posedge intf.clk);\n\n        #1;\n\n        intf.rst = 0;\n\n        env = new(\n            intf,\n            N\n        );\n\n        env.run();\n        $finish;\n\n    end\n\nendmodule\n"
 },
 {
  "id": "dpm",
  "title": "Dual Port Memory",
  "desc": "Dual-port memory with HVL testbench.",
  "rtlFile": "rtl/top.sv",
  "tbFile": "tb/tb_top.sv",
  "rtl": "`timescale 1ns/1ps\n\nmodule dual_port_ram (\n    input  logic       clk,\n\n    input  logic       we_a,\n    input  logic [3:0] addr_a,\n    input  logic [7:0] data_in_a,\n    output logic [7:0] data_out_a,\n\n    input  logic       we_b,\n    input  logic [3:0] addr_b,\n    input  logic [7:0] data_in_b,\n    output logic [7:0] data_out_b\n);\n\n    logic [7:0] memory [0:15];\n\n    always_ff @(posedge clk) begin\n        if (we_a) begin\n            memory[addr_a] <= data_in_a;\n        end\n        else begin\n            data_out_a <= memory[addr_a];\n        end\n    end\n\n    always_ff @(posedge clk) begin\n        if (we_b) begin\n            memory[addr_b] <= data_in_b;\n        end\n        else begin\n            data_out_b <= memory[addr_b];\n        end\n    end\n\nendmodule\n",
  "tb": "`timescale 1ns/1ps\n\ninterface dpram_if;\n\n    logic       clk;\n    logic       we_a;\n    logic [3:0] addr_a;\n    logic [7:0] data_in_a;\n    logic [7:0] data_out_a;\n\n    logic       we_b;\n    logic [3:0] addr_b;\n    logic [7:0] data_in_b;\n    logic [7:0] data_out_b;\n\nendinterface\n\nclass dpram_transaction;\n\n    rand bit       we_a;\n    rand bit [3:0] addr_a;\n    rand bit [7:0] data_in_a;\n\n    rand bit       we_b;\n    rand bit [3:0] addr_b;\n    rand bit [7:0] data_in_b;\n\n    logic [7:0] data_out_a;\n    logic [7:0] data_out_b;\n\n    constraint distinct_addr_c\n    {\n        addr_a != addr_b;\n    }\n\nendclass\n\nclass dpram_generator;\n\n    mailbox #(dpram_transaction) gen2drv;\n    int n;\n\n    function new\n    (\n        mailbox #(dpram_transaction) gen2drv,\n        int n\n    );\n\n        this.gen2drv = gen2drv;\n        this.n       = n;\n\n    endfunction\n\n    task run();\n\n        dpram_transaction tr;\n\n        repeat(n)\n        begin\n\n            tr = new();\n\n            if(!tr.randomize())\n                $display(\"Randomization failed\");\n\n            gen2drv.put(tr);\n\n        end\n\n    endtask\n\nendclass\n\nclass dpram_driver;\n\n    virtual dpram_if vif;\n\n    mailbox #(dpram_transaction) gen2drv;\n\n    int n;\n\n    function new\n    (\n        virtual dpram_if vif,\n        mailbox #(dpram_transaction) gen2drv,\n        int n\n    );\n\n        this.vif     = vif;\n        this.gen2drv = gen2drv;\n        this.n       = n;\n\n    endfunction\n\n    task run();\n\n        dpram_transaction tr;\n\n        repeat(n)\n        begin\n\n            gen2drv.get(tr);\n\n            @(negedge vif.clk);\n\n            vif.we_a      = tr.we_a;\n            vif.addr_a    = tr.addr_a;\n            vif.data_in_a = tr.data_in_a;\n\n            vif.we_b      = tr.we_b;\n            vif.addr_b    = tr.addr_b;\n            vif.data_in_b = tr.data_in_b;\n\n        end\n\n    endtask\n\nendclass\n\nclass dpram_monitor;\n\n    virtual dpram_if vif;\n\n    mailbox #(dpram_transaction) mon2sb;\n    int n;\n\n    function new\n    (\n        virtual dpram_if vif,\n        mailbox #(dpram_transaction) mon2sb,\n        int n\n    );\n\n        this.vif    = vif;\n        this.mon2sb = mon2sb;\n        this.n      = n;\n\n    endfunction\n\n    task run();\n\n        dpram_transaction tr;\n\n        repeat(n)\n        begin\n\n            @(posedge vif.clk);\n\n            tr = new();\n            tr.we_a      = vif.we_a;\n            tr.addr_a    = vif.addr_a;\n            tr.data_in_a = vif.data_in_a;\n            tr.we_b      = vif.we_b;\n            tr.addr_b    = vif.addr_b;\n            tr.data_in_b = vif.data_in_b;\n\n            #1;\n\n            tr.data_out_a = vif.data_out_a;\n            tr.data_out_b = vif.data_out_b;\n            mon2sb.put(tr);\n\n        end\n\n    endtask\n\nendclass\n\nclass dpram_scoreboard;\n\n    mailbox #(dpram_transaction) mon2sb;\n\n    logic [7:0] ref_mem [0:15];\n\n    int n;\n    int pass = 0;\n    int fail = 0;\n\n    function new\n    (\n        mailbox #(dpram_transaction) mon2sb,\n        int n\n    );\n\n        this.mon2sb = mon2sb;\n        this.n      = n;\n\n    endfunction\n\n    task run();\n\n        dpram_transaction tr;\n        bit ok_a, ok_b;\n\n        repeat(n)\n        begin\n\n            mon2sb.get(tr);\n\n            if(tr.we_a)\n            begin\n                ref_mem[tr.addr_a] = tr.data_in_a;\n                ok_a = 1'b1;\n            end\n            else\n            begin\n                ok_a = (tr.data_out_a === ref_mem[tr.addr_a]);\n            end\n\n            if(tr.we_b)\n            begin\n                ref_mem[tr.addr_b] = tr.data_in_b;\n                ok_b = 1'b1;\n            end\n            else\n            begin\n                ok_b = (tr.data_out_b === ref_mem[tr.addr_b]);\n            end\n\n            if(ok_a && ok_b)\n            begin\n\n                pass++;\n\n            end\n\n            else\n            begin\n\n                fail++;\n\n                $display(\n                    \"ERROR: ADDR_A=%h EXP_A=%h ACT_A=%h | ADDR_B=%h EXP_B=%h ACT_B=%h\",\n                    tr.addr_a, ref_mem[tr.addr_a], tr.data_out_a,\n                    tr.addr_b, ref_mem[tr.addr_b], tr.data_out_b\n                );\n\n            end\n\n        end\n\n        $display(\"PASS = %0d | FAIL = %0d\", pass, fail);\n    endtask\n\nendclass\n\nclass dpram_environment;\n\n    virtual dpram_if vif;\n\n    mailbox #(dpram_transaction) gen2drv;\n    mailbox #(dpram_transaction) mon2sb;\n\n    dpram_generator  gen;\n    dpram_driver     drv;\n    dpram_monitor    mon;\n    dpram_scoreboard sb;\n    int n;\n\n    function new\n    (\n        virtual dpram_if vif,\n        int n\n    );\n\n        this.vif = vif;\n        this.n   = n;\n\n        gen2drv = new();\n        mon2sb  = new();\n        gen = new(\n            gen2drv,\n            n\n        );\n\n        drv = new(\n            vif,\n            gen2drv,\n            n\n        );\n\n        mon = new(\n            vif,\n            mon2sb,\n            n\n        );\n\n        sb = new(\n            mon2sb,\n            n\n        );\n\n    endfunction\n\n    task run();\n\n        fork\n\n            gen.run();\n            drv.run();\n            mon.run();\n            sb.run();\n\n        join\n\n    endtask\n\nendclass\n\nmodule tb_top;\n\n    parameter int N = 100;\n\n    dpram_if intf();\n\n    dual_port_ram dut\n    (\n        .clk        (intf.clk),\n        .we_a       (intf.we_a),\n        .addr_a     (intf.addr_a),\n        .data_in_a  (intf.data_in_a),\n        .data_out_a (intf.data_out_a),\n        .we_b       (intf.we_b),\n        .addr_b     (intf.addr_b),\n        .data_in_b  (intf.data_in_b),\n        .data_out_b (intf.data_out_b)\n    );\n\n    dpram_environment env;\n\n    initial\n    begin\n\n        intf.clk = 0;\n\n        forever #5\n            intf.clk = ~intf.clk;\n\n    end\n\n    initial\n    begin\n\n        intf.we_a      = 0;\n        intf.addr_a    = 0;\n        intf.data_in_a = 0;\n        intf.we_b      = 0;\n        intf.addr_b    = 0;\n        intf.data_in_b = 0;\n\n        env = new(\n            intf,\n            N\n        );\n\n        env.run();\n        $finish;\n\n    end\n\nendmodule\n"
 },
 {
  "id": "pe",
  "title": "Priority Encoder",
  "desc": "4-to-2 priority encoder with HVL testbench.",
  "rtlFile": "rtl/top.sv",
  "tbFile": "tb/tb_top.sv",
  "rtl": "`timescale 1ns/1ps\n\nmodule priority_encoder_4bit (\n    input  logic [3:0] req,\n    output logic [1:0] code,\n    output logic       valid\n);\n\n    always_comb begin\n        valid = 1'b1;\n        code  = 2'b00;\n\n        casex (req)\n            4'b1xxx: code = 2'b11;\n            4'b01xx: code = 2'b10;\n            4'b001x: code = 2'b01;\n            4'b0001: code = 2'b00;\n            4'b0000: begin\n                code  = 2'b00;\n                valid = 1'b0;\n            end\n            default: begin\n                code  = 2'b00;\n                valid = 1'b0;\n            end\n        endcase\n    end\n\nendmodule\n",
  "tb": "`timescale 1ns/1ps\n\ninterface pe_if;\n\n    logic [3:0] req;\n    logic [1:0] code;\n    logic       valid;\n\nendinterface\n\nclass pe_transaction;\n\n    rand bit [3:0] req;\n\n    logic [1:0] code;\n    logic       valid;\n\nendclass\n\nclass pe_generator;\n\n    mailbox #(pe_transaction) gen2drv;\n    int n;\n\n    function new\n    (\n        mailbox #(pe_transaction) gen2drv,\n        int n\n    );\n\n        this.gen2drv = gen2drv;\n        this.n       = n;\n\n    endfunction\n\n    task run();\n\n        pe_transaction tr;\n\n        repeat(n)\n        begin\n\n            tr = new();\n\n            if(!tr.randomize())\n                $display(\"Randomization failed\");\n\n            gen2drv.put(tr);\n\n        end\n\n    endtask\n\nendclass\n\nclass pe_driver;\n\n    virtual pe_if vif;\n\n    mailbox #(pe_transaction) gen2drv;\n    mailbox #(pe_transaction) drv2mon;\n\n    int n;\n\n    function new\n    (\n        virtual pe_if vif,\n        mailbox #(pe_transaction) gen2drv,\n        mailbox #(pe_transaction) drv2mon,\n        int n\n    );\n\n        this.vif     = vif;\n        this.gen2drv = gen2drv;\n        this.drv2mon = drv2mon;\n        this.n       = n;\n\n    endfunction\n\n    task run();\n\n        pe_transaction tr;\n\n        repeat(n)\n        begin\n\n            gen2drv.get(tr);\n\n            vif.req = tr.req;\n\n            #1;\n\n            drv2mon.put(tr);\n\n            #1;\n\n        end\n\n    endtask\n\nendclass\n\nclass pe_monitor;\n\n    virtual pe_if vif;\n\n    mailbox #(pe_transaction) drv2mon;\n    mailbox #(pe_transaction) mon2sb;\n\n    int n;\n\n    function new\n    (\n        virtual pe_if vif,\n        mailbox #(pe_transaction) drv2mon,\n        mailbox #(pe_transaction) mon2sb,\n        int n\n    );\n\n        this.vif     = vif;\n        this.drv2mon = drv2mon;\n        this.mon2sb  = mon2sb;\n        this.n       = n;\n\n    endfunction\n\n    task run();\n\n        pe_transaction tr;\n\n        repeat(n)\n        begin\n\n            drv2mon.get(tr);\n\n            tr.code  = vif.code;\n            tr.valid = vif.valid;\n\n            mon2sb.put(tr);\n\n        end\n\n    endtask\n\nendclass\n\nclass pe_scoreboard;\n\n    mailbox #(pe_transaction) mon2sb;\n\n    int n;\n    int pass = 0;\n    int fail = 0;\n\n    function new\n    (\n        mailbox #(pe_transaction) mon2sb,\n        int n\n    );\n\n        this.mon2sb = mon2sb;\n        this.n      = n;\n\n    endfunction\n\n    task run();\n\n        pe_transaction tr;\n\n        logic [1:0] exp_code;\n        logic       exp_valid;\n\n        repeat(n)\n        begin\n\n            mon2sb.get(tr);\n\n            exp_valid = |tr.req;\n\n            if(tr.req[3])\n                exp_code = 2'b11;\n\n            else if(tr.req[2])\n                exp_code = 2'b10;\n\n            else if(tr.req[1])\n                exp_code = 2'b01;\n\n            else\n                exp_code = 2'b00;\n\n            if((tr.code  === exp_code) &&\n               (tr.valid === exp_valid))\n            begin\n\n                pass++;\n\n            end\n\n            else\n            begin\n\n                fail++;\n\n                $display(\n                    \"ERROR: req=%b Expected=%b,%b Actual=%b,%b\",\n                    tr.req,\n                    exp_code,\n                    exp_valid,\n                    tr.code,\n                    tr.valid\n                );\n\n            end\n\n        end\n\n        $display(\"PASS = %0d | FAIL = %0d\", pass, fail);\n\n    endtask\n\nendclass\n\nclass pe_environment;\n\n    virtual pe_if vif;\n\n    mailbox #(pe_transaction) gen2drv;\n    mailbox #(pe_transaction) drv2mon;\n    mailbox #(pe_transaction) mon2sb;\n\n    pe_generator  gen;\n    pe_driver     drv;\n    pe_monitor    mon;\n    pe_scoreboard sb;\n\n    int n;\n\n    function new\n    (\n        virtual pe_if vif,\n        int n\n    );\n\n        this.vif = vif;\n        this.n   = n;\n\n        gen2drv = new();\n        drv2mon = new();\n        mon2sb  = new();\n\n        gen = new(\n            gen2drv,\n            n\n        );\n\n        drv = new(\n            vif,\n            gen2drv,\n            drv2mon,\n            n\n        );\n\n        mon = new(\n            vif,\n            drv2mon,\n            mon2sb,\n            n\n        );\n\n        sb = new(\n            mon2sb,\n            n\n        );\n\n    endfunction\n\n    task run();\n\n        fork\n\n            gen.run();\n            drv.run();\n            mon.run();\n            sb.run();\n\n        join\n\n    endtask\n\nendclass\n\nmodule tb_top;\n\n    parameter int N = 100;\n\n    pe_if intf();\n\n    priority_encoder_4bit dut\n    (\n        .req   (intf.req),\n        .code  (intf.code),\n        .valid (intf.valid)\n    );\n\n    pe_environment env;\n\n    initial\n    begin\n\n        intf.req = 4'b0000;\n\n        env = new(\n            intf,\n            N\n        );\n\n        env.run();\n\n        $finish;\n\n    end\n\nendmodule\n"
 },
 {
  "id": "spram",
  "title": "Single Port RAM",
  "desc": "Single-port RAM with HVL testbench.",
  "rtlFile": "rtl/top.sv",
  "tbFile": "tb/tb_top.sv",
  "rtl": "`timescale 1ns/1ps\n\nmodule single_port_ram (\n    input  logic       clk,\n    input  logic       we,\n    input  logic [3:0] addr,\n    input  logic [7:0] data_in,\n    output logic [7:0] data_out\n);\n\n    logic [7:0] memory [0:15];\n\n    always_ff @(posedge clk) begin\n        if (we) begin\n            memory[addr] <= data_in;\n        end\n        else begin\n            data_out <= memory[addr];\n        end\n    end\n\nendmodule\n",
  "tb": "`timescale 1ns/1ps\n\ninterface ram_if;\n\n    logic       clk;\n    logic       we;\n    logic [3:0] addr;\n    logic [7:0] data_in;\n    logic [7:0] data_out;\n\nendinterface\n\nclass ram_transaction;\n\n    rand bit       we;\n    rand bit [3:0] addr;\n    rand bit [7:0] data_in;\n\n    logic [7:0] data_out;\n\nendclass\n\nclass ram_generator;\n\n    mailbox #(ram_transaction) gen2drv;\n    int n;\n\n    function new\n    (\n        mailbox #(ram_transaction) gen2drv,\n        int n\n    );\n\n        this.gen2drv = gen2drv;\n        this.n       = n;\n\n    endfunction\n\n    task run();\n\n        ram_transaction tr;\n\n        repeat(n)\n        begin\n\n            tr = new();\n\n            if(!tr.randomize())\n                $display(\"Randomization failed\");\n\n            gen2drv.put(tr);\n\n        end\n\n    endtask\n\nendclass\n\nclass ram_driver;\n\n    virtual ram_if vif;\n\n    mailbox #(ram_transaction) gen2drv;\n\n    int n;\n\n    function new\n    (\n        virtual ram_if vif,\n        mailbox #(ram_transaction) gen2drv,\n        int n\n    );\n\n        this.vif     = vif;\n        this.gen2drv = gen2drv;\n        this.n       = n;\n\n    endfunction\n\n    task run();\n\n        ram_transaction tr;\n\n        repeat(n)\n        begin\n\n            gen2drv.get(tr);\n\n            @(negedge vif.clk);\n\n            vif.we      = tr.we;\n            vif.addr    = tr.addr;\n            vif.data_in = tr.data_in;\n\n        end\n\n    endtask\n\nendclass\n\nclass ram_monitor;\n\n    virtual ram_if vif;\n\n    mailbox #(ram_transaction) mon2sb;\n    int n;\n\n    function new\n    (\n        virtual ram_if vif,\n        mailbox #(ram_transaction) mon2sb,\n        int n\n    );\n\n        this.vif    = vif;\n        this.mon2sb = mon2sb;\n        this.n      = n;\n\n    endfunction\n\n    task run();\n\n        ram_transaction tr;\n\n        repeat(n)\n        begin\n\n            @(posedge vif.clk);\n\n            tr = new();\n            tr.we      = vif.we;\n            tr.addr    = vif.addr;\n            tr.data_in = vif.data_in;\n\n            #1;\n\n            tr.data_out = vif.data_out;\n            mon2sb.put(tr);\n\n        end\n\n    endtask\n\nendclass\n\nclass ram_scoreboard;\n\n    mailbox #(ram_transaction) mon2sb;\n\n    logic [7:0] ref_mem [0:15];\n\n    int n;\n    int pass = 0;\n    int fail = 0;\n\n    function new\n    (\n        mailbox #(ram_transaction) mon2sb,\n        int n\n    );\n\n        this.mon2sb = mon2sb;\n        this.n      = n;\n\n    endfunction\n\n    task run();\n\n        ram_transaction tr;\n\n        repeat(n)\n        begin\n\n            mon2sb.get(tr);\n\n            if(tr.we)\n            begin\n\n                ref_mem[tr.addr] = tr.data_in;\n                pass++;\n\n            end\n\n            else\n            begin\n\n                if(tr.data_out === ref_mem[tr.addr])\n                begin\n\n                    pass++;\n\n                end\n\n                else\n                begin\n\n                    fail++;\n\n                    $display(\n                        \"ERROR: ADDR=%h Expected=%h Actual=%h\",\n                        tr.addr,\n                        ref_mem[tr.addr],\n                        tr.data_out\n                    );\n\n                end\n\n            end\n\n        end\n\n        $display(\"PASS = %0d | FAIL = %0d\", pass, fail);\n    endtask\n\nendclass\n\nclass ram_environment;\n\n    virtual ram_if vif;\n\n    mailbox #(ram_transaction) gen2drv;\n    mailbox #(ram_transaction) mon2sb;\n\n    ram_generator  gen;\n    ram_driver     drv;\n    ram_monitor    mon;\n    ram_scoreboard sb;\n    int n;\n\n    function new\n    (\n        virtual ram_if vif,\n        int n\n    );\n\n        this.vif = vif;\n        this.n   = n;\n\n        gen2drv = new();\n        mon2sb  = new();\n        gen = new(\n            gen2drv,\n            n\n        );\n\n        drv = new(\n            vif,\n            gen2drv,\n            n\n        );\n\n        mon = new(\n            vif,\n            mon2sb,\n            n\n        );\n\n        sb = new(\n            mon2sb,\n            n\n        );\n\n    endfunction\n\n    task run();\n\n        fork\n\n            gen.run();\n            drv.run();\n            mon.run();\n            sb.run();\n\n        join\n\n    endtask\n\nendclass\n\nmodule tb_top;\n\n    parameter int N = 100;\n\n    ram_if intf();\n\n    single_port_ram dut\n    (\n        .clk      (intf.clk),\n        .we       (intf.we),\n        .addr     (intf.addr),\n        .data_in  (intf.data_in),\n        .data_out (intf.data_out)\n    );\n\n    ram_environment env;\n\n    initial\n    begin\n\n        intf.clk = 0;\n\n        forever #5\n            intf.clk = ~intf.clk;\n\n    end\n\n    initial\n    begin\n\n        intf.we      = 0;\n        intf.addr    = 0;\n        intf.data_in = 0;\n\n        env = new(\n            intf,\n            N\n        );\n\n        env.run();\n        $finish;\n\n    end\n\nendmodule\n"
 }
];

</script>
<script>
/* HVL Lab viewer logic — pure ES5, zero dependencies, compatible with old college lab browsers (Firefox ESR, old Chrome, IE11+, file://) */
(function () {
  'use strict';

  var exps = window.EXPERIMENTS || [];
  var grid = document.getElementById('grid');
  var empty = document.getElementById('empty');
  var search = document.getElementById('search');
  var count = document.getElementById('count');
  var homeView = document.getElementById('homeView');
  var detailView = document.getElementById('detailView');
  var toastEl = document.getElementById('toast');
  var current = null;
  var toastTimer = null;

  /* ---------- helpers ---------- */

  function setHidden(el, hide) {
    if (!el) return;
    el.hidden = !!hide;
    el.style.display = hide ? 'none' : 'block';
  }

  function isHidden(el) {
    if (!el) return true;
    return !!el.hidden || el.style.display === 'none';
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  var KW = ('module endmodule interface endinterface class endclass function endfunction ' +
    'task endtask package endpackage program endprogram property endproperty sequence endsequence ' +
    'covergroup endgroup coverpoint cross constraint solve before foreach unique ' +
    'input output inout logic bit reg wire signed unsigned int integer longint shortint byte ' +
    'string real time chandle event semaphore mailbox virtual extends implements ' +
    'rand randc randcase static automatic const ref new this super return break continue ' +
    'if else case casex casez endcase default for while do repeat forever fork join join_any join_none ' +
    'begin end always always_comb always_ff always_latch assign initial final ' +
    'posedge negedge edge typedef enum struct union packed localparam parameter ' +
    'import export timescale timeunit timeprecision assert assume cover expect ' +
    'bins binsof illegal_bins ignore_bins wildcard with inside dist null priority').split(' ');

  function highlight(src) {
    var e = esc(src);
    var re = new RegExp(
      '(\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/)' +
      '|("(?:[^"\\\\\\n]|\\\\.)*"|\'(?:[^\'\\\\\\n]|\\\\.)*\')' +
      '|(`[A-Za-z_]\\w*)' +
      '|(\\b\\d[\\w\'h_]*)' +
      '|\\b(' + KW.join('|') + ')\\b',
      'g');
    var out = '';
    var last = 0;
    var m;
    while ((m = re.exec(e)) !== null) {
      out += e.slice(last, m.index);
      if (m[1]) out += '<span class="c-com">' + m[1] + '</span>';
      else if (m[2]) out += '<span class="c-str">' + m[2] + '</span>';
      else if (m[3]) out += '<span class="c-pp">' + m[3] + '</span>';
      else if (m[4]) out += '<span class="c-num">' + m[4] + '</span>';
      else if (m[5]) out += '<span class="c-kw">' + m[5] + '</span>';
      last = m.index + m[0].length;
    }
    out += e.slice(last);
    return out;
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.className = 'toast show';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = 'toast'; }, 2000);
  }

  function selectElementText(el) {
    try {
      if (window.getSelection && document.createRange) {
        var sel = window.getSelection();
        var range = document.createRange();
        range.selectNodeContents(el);
        sel.removeAllRanges();
        sel.addRange(range);
        return true;
      } else if (document.body.createTextRange) {
        var textRange = document.body.createTextRange();
        textRange.moveToElementText(el);
        textRange.select();
        return true;
      }
    } catch (e) {}
    return false;
  }

  function copyText(text, label, fallbackCodeEl) {
    function done() { toast(label + ' copied'); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.top = '0';
      ta.style.left = '-9999px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      document.body.removeChild(ta);
      if (ok) {
        done();
      } else if (fallbackCodeEl && selectElementText(fallbackCodeEl)) {
        toast('Code selected - press Ctrl+C to copy');
      } else {
        toast('Select code manually and press Ctrl+C');
      }
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, fallback);
      } else {
        fallback();
      }
    } catch (e) {
      fallback();
    }
  }

  function download(filename, text) {
    try {
      var urlObj = window.URL || window.webkitURL;
      if (typeof Blob !== 'undefined' && urlObj && urlObj.createObjectURL) {
        var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        if (window.navigator && window.navigator.msSaveBlob) {
          window.navigator.msSaveBlob(blob, filename);
          toast(filename + ' downloaded');
          return;
        }
        var url = urlObj.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.setAttribute('download', filename);
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        setTimeout(function () {
          document.body.removeChild(a);
          urlObj.revokeObjectURL(url);
        }, 150);
        toast(filename + ' downloaded');
        return;
      }
      var dataA = document.createElement('a');
      dataA.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(text);
      dataA.setAttribute('download', filename);
      dataA.style.display = 'none';
      document.body.appendChild(dataA);
      dataA.click();
      document.body.removeChild(dataA);
      toast(filename + ' downloaded');
    } catch (err) {
      toast('Download not supported in this browser');
    }
  }

  function safeName(title, suffix) {
    return title.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') + suffix;
  }

  /* ---------- home grid ---------- */

  function renderList() {
    var q = (search.value || '').replace(/^\s+|\s+$/g, '').toLowerCase();
    grid.innerHTML = '';
    var shown = 0;
    for (var i = 0; i < exps.length; i++) {
      var x = exps[i];
      if (q && x.title.toLowerCase().indexOf(q) === -1 &&
          x.desc.toLowerCase().indexOf(q) === -1) continue;
      shown++;
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'card';
      b.setAttribute('data-id', x.id);
      b.innerHTML =
        '<h3>' + esc(x.title) + '</h3>' +
        '<p>' + esc(x.desc) + '</p>' +
        '<span class="meta">rtl/top.sv &middot; tb/tb_top.sv</span>';
      (function (id) {
        b.addEventListener('click', function () { openExp(id); });
      })(x.id);
      grid.appendChild(b);
    }
    setHidden(empty, shown !== 0);
    count.textContent = shown + ' / ' + exps.length;
  }

  /* ---------- detail ---------- */

  function fillPane(codeId, gutterId, src) {
    var codeEl = document.getElementById(codeId);
    var gutterEl = document.getElementById(gutterId);
    codeEl.innerHTML = highlight(src);
    var n = src.split('\n').length;
    var g = '';
    for (var i = 1; i <= n; i++) g += i + '\n';
    gutterEl.textContent = g;
  }

  function combinedText(x) {
    var tbClean = x.tb.replace(/^\s*`timescale[^\n]*\n+/, '');
    return x.rtl.replace(/\s+$/, '') + '\n\n' + tbClean.replace(/\s+$/, '') + '\n';
  }

  function openExp(id) {
    var x = null;
    for (var i = 0; i < exps.length; i++) {
      if (exps[i].id === id) { x = exps[i]; break; }
    }
    if (!x) return;
    current = x;
    document.getElementById('expTitle').textContent = x.title;
    document.getElementById('expDesc').textContent = x.desc;
    document.getElementById('rtlName').textContent = x.rtlFile;
    document.getElementById('tbName').textContent = x.tbFile;
    fillPane('rtlCode', 'rtlGutter', x.rtl);
    fillPane('tbCode', 'tbGutter', x.tb);
    document.getElementById('rtlScroll').scrollTop = 0;
    document.getElementById('tbScroll').scrollTop = 0;
    setHidden(homeView, true);
    setHidden(detailView, false);
    try {
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', '#' + x.id);
      } else {
        location.hash = x.id;
      }
    } catch (e) {}
    window.scrollTo(0, 0);
    try { document.getElementById('backBtn').focus(); } catch (e) {}
  }

  function goHome() {
    current = null;
    setHidden(detailView, true);
    setHidden(homeView, false);
    try {
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', location.pathname + location.search);
      } else {
        location.hash = '';
      }
    } catch (e) {}
    window.scrollTo(0, 0);
    try { search.focus(); } catch (e) {}
  }

  /* ---------- events ---------- */

  search.addEventListener('input', renderList);
  search.addEventListener('keyup', renderList);
  document.getElementById('backBtn').addEventListener('click', goHome);

  document.getElementById('copyRtlBtn').addEventListener('click', function () {
    if (current) copyText(current.rtl, 'RTL', document.getElementById('rtlCode'));
  });
  document.getElementById('copyTbBtn').addEventListener('click', function () {
    if (current) copyText(current.tb, 'Testbench', document.getElementById('tbCode'));
  });
  document.getElementById('copyAllBtn').addEventListener('click', function () {
    if (current) copyText(combinedText(current), 'RTL + TB', document.getElementById('rtlCode'));
  });
  document.getElementById('dlRtlBtn').addEventListener('click', function () {
    if (current) download(safeName(current.title, '_rtl.sv'), current.rtl);
  });
  document.getElementById('dlTbBtn').addEventListener('click', function () {
    if (current) download(safeName(current.title, '_tb.sv'), current.tb);
  });
  document.getElementById('dlAllBtn').addEventListener('click', function () {
    if (!current) return;
    download(safeName(current.title, '_rtl.sv'), current.rtl);
    setTimeout(function () { download(safeName(current.title, '_tb.sv'), current.tb); }, 250);
  });

  document.addEventListener('keydown', function (ev) {
    var k = ev.key || '';
    var code = ev.keyCode || ev.which || 0;
    if ((k === 'Escape' || k === 'Esc' || code === 27) && !isHidden(detailView)) {
      goHome();
    }
  });

  /* ---------- init ---------- */

  renderList();
  var hash = (location.hash || '').replace(/^#/, '');
  if (hash) openExp(hash);
})();

</script>
